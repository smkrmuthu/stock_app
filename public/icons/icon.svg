<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Candlestick Bar 1 (Bearish subtle) -->
  <line x1="120" y1="200" x2="120" y2="340" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <rect x="104" y="230" width="32" height="70" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>

  <!-- Candlestick Bar 2 (Bullish Main) -->
  <line x1="200" y1="130" x2="200" y2="370" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <rect x="182" y="170" width="36" height="130" rx="6" fill="url(#bullGrad)" filter="url(#glow)"/>

  <!-- Candlestick Bar 3 (Bullish High) -->
  <line x1="280" y1="90" x2="280" y2="330" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <rect x="262" y="120" width="36" height="120" rx="6" fill="url(#blueGrad)" filter="url(#glow)"/>

  <!-- Candlestick Bar 4 (Breakout) -->
  <line x1="360" y1="110" x2="360" y2="380" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <rect x="342" y="150" width="36" height="150" rx="6" fill="url(#bullGrad)"/>

  <!-- Pulse Line Graph Overlaid -->
  <path d="M 60 380 L 140 330 L 210 240 L 280 160 L 360 190 L 450 100" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glowing Head Point -->
  <circle cx="450" cy="100" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="450" cy="100" r="5" fill="#ffffff"/>
</svg>
